<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學校行事曆與段考月曆</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #334155;
      padding: 20px;
    }

    .calendar-container {
      max-width: 1000px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .calendar-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #1e293b;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background-color: #e2e8f0;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
    }

    .weekday-header {
      background-color: #f1f5f9;
      padding: 12px;
      text-align: center;
      font-weight: 600;
      color: #475569;
    }

    .day-cell {
      background-color: #ffffff;
      min-height: 100px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s;
    }

    .day-cell.empty {
      background-color: #f8fafc;
    }

    .day-number {
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
    }

    /* 1. 週六與週日灰底 */
    .day-cell.weekend {
      background-color: #f1f5f9;
      color: #64748b;
    }

    .day-cell.weekend:hover {
      background-color: #e2e8f0;
    }

    /* 2. 段考日灰底與標示 */
    .day-cell.exam-day {
      background-color: #e2e8f0 !important;
      color: #334155;
    }

    .day-cell.exam-day:hover {
      background-color: #cbd5e1 !important;
    }

    .exam-tag {
      background-color: #ef4444;
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
      margin-top: 4px;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="calendar-container">
    <div class="calendar-header">
      <h1 class="calendar-title" id="monthTitle">2026 年 10 月</h1>
    </div>

    <div class="calendar-grid" id="calendarGrid">
      <!-- 星期表頭 -->
      <div class="weekday-header">日</div>
      <div class="weekday-header">一</div>
      <div class="weekday-header">二</div>
      <div class="weekday-header">三</div>
      <div class="weekday-header">四</div>
      <div class="weekday-header">五</div>
      <div class="weekday-header">六</div>
      <!-- 日期儲存格會由 JavaScript 自動生成 -->
    </div>
  </div>

  <script>
    // 範例段考資料庫 (格式: YYYY-MM-DD)
    const examDates = {
      "2026-10-15": "第一次段考",
      "2026-10-16": "第一次段考"
    };

    // 檢查某日期是否有段考
    function getExamInfoForDate(dateStr) {
      return examDates[dateStr] || null;
    }

    function renderCalendars(year, month) {
      const calendarGrid = document.getElementById('calendarGrid');
      const monthTitle = document.getElementById('monthTitle');
      
      monthTitle.innerText = `${year} 年 ${month + 1} 月`;

      // 清除舊的日期儲存格 (保留前 7 個星期表頭)
      while (calendarGrid.children.length > 7) {
        calendarGrid.removeChild(calendarGrid.lastChild);
      }

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // 補上第一天前面的空白格子
      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty';
        calendarGrid.appendChild(emptyCell);
      }

      // 生成當月天數
      for (let day = 1; day <= daysInMonth; day++) {
        const dayCell = document.createElement('div');
        dayCell.className = 'day-cell';
        
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const examInfo = getExamInfoForDate(dateStr);

        // 判斷是否為星期六(6)或星期日(0)
        const currentDayObj = new Date(year, month, day);
        const dayOfWeek = currentDayObj.getDay();
        const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

        // 套用灰底 class：段考優先，再來是六日
        if (examInfo) {
          dayCell.classList.add('exam-day');
        } else if (isWeekend) {
          dayCell.classList.add('weekend');
        }

        // 插入日期數字
        const dayNumber = document.createElement('div');
        dayNumber.className = 'day-number';
        dayNumber.innerText = day;
        dayCell.appendChild(dayNumber);

        // 如果是段考日，加入段考標籤
        if (examInfo) {
          const examTag = document.createElement('div');
          examTag.className = 'exam-tag';
          examTag.innerText = examInfo;
          dayCell.appendChild(examTag);
        }

        calendarGrid.appendChild(dayCell);
      }
    }

    // 初始化渲染 (以 2026 年 10 月為例)
    renderCalendars(2026, 9); // 月份為 0-indexed，9 代表 10 月
  </script>
</body>
</html>
